[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 130
extend-exclude = ["notebooks"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"ui/theme.py" = ["E501"]      # the CSS and HTML strings are easier to read as long lines
"ui/pages/how_it_works.py" = ["E501"]   # contains the graph definition
